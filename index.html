const parseCSV=(text)=>{
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else if(c==='"') q=true;
    else if(c===","){ row.push(f);f="" }
    else if(c==="\n"){ row.push(f);f="";rows.push(row);row=[] }
    else if(c!=="\r") f+=c;
  }
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()!==""));
};
const norm=(s)=>(s||"").replace(/\s+/g," ").trim();

const aggregate=(rows)=>{
  const empty={present:new Map(),notes:[],unmatched:[],last:null,submits:0};
  if(!rows||!rows.length) return empty;
  const head=rows[0].map(norm);
  const iUnit=head.indexOf(COL_UNIT);
  if(iUnit<0) return empty;
  const iBy=head.indexOf(COL_BY);
  const master=new Map(IIT.map(d=>[norm(d.n),d]));
  const present=new Map(),notes=[],unmatched=[];
  let last=null;
  for(let r=1;r<rows.length;r++){
    const row=rows[r],ts=norm(row[0]);
    if(ts) last=ts;
    const unit=norm(row[iUnit]); if(!unit) continue;
    const iL=head.indexOf(COL_LIST+unit);
    const iN=head.indexOf(COL_NOTE+unit);
    if(iL>=0&&row[iL]){
      norm(row[iL]).split(",").map(norm).filter(Boolean).forEach(nm=>{
        if(nm===NONE_OPT) return;
        const hit=master.get(nm);
        if(hit){ if(!present.has(hit.id)) present.set(hit.id,ts) }
        else unmatched.push({name:nm,unit,ts});
      });
    }
    if(iN>=0&&norm(row[iN])) notes.push({unit,text:norm(row[iN]),ts,by:iBy>=0?norm(row[iBy]):""});
  }
  return {present,notes,unmatched,last,submits:rows.length-1};
};

/* ---------- UI bits ---------- */
const Btn=({onClick,children,bg=P,color="#fff",bd="none",dis})=>(
  <button onClick={onClick} disabled={dis} style={{padding:"8px 16px",borderRadius:8,border:bd,background:dis?"#CBD5E1":bg,color,fontSize:14,fontWeight:600,cursor:dis?"default":"pointer"}}>{children}</button>
);
const Card=({children,accent})=>(
  <div style={{background:"#fff",borderRadius:12,padding:16,boxShadow:"0 1px 3px rgba(0,0,0,.08)",borderTop:accent?`4px solid ${accent}`:"none"}}>{children}</div>
);

/* ---------- App ---------- */
function App(){
  const [raw,setRaw]=useState(null);
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState(false);
  const [at,setAt]=useState(null);
  const [ov,setOv]=useState({});
  const [ovLoaded,setOvLoaded]=useState(false);
  const [demo,setDemo]=useState(false);
  const [openU,setOpenU]=useState({});
  const [copied,setCopied]=useState("");
  const [q,setQ]=useState("");
  const [onlyMissing,setOnlyMissing]=useState(false);

  useEffect(()=>{(async()=>{
    try{const r=await window.storage.get(SKEY);if(r&&r.value)setOv(JSON.parse(r.value))}catch(e){}
    finally{setOvLoaded(true)}
  })()},[]);
  useEffect(()=>{if(ovLoaded){(async()=>{try{await window.storage.set(SKEY,JSON.stringify(ov))}catch(e){}})()}},[ov,ovLoaded]);

  const load=useCallback(async()=>{
    setBusy(true);setErr("");
    try{
      const res=await fetch(CSV_URL+"&_="+Date.now());
      if(!res.ok) throw new Error("HTTP "+res.status);
      const t=await res.text();
      if(t.trim().startsWith("<")) throw new Error("ได้ HTML แทน CSV — ตรวจว่า Publish to web เลือก CSV แล้วหรือยัง");
      setRaw(parseCSV(t));setDemo(false);setAt(new Date());
    }catch(e){ setErr(e.message||"ดึงข้อมูลไม่สำเร็จ") }
    finally{ setBusy(false) }
  },[]);
  useEffect(()=>{load()},[load]);

  const loadDemo=()=>{
    const us=[...new Set(IIT.map(d=>d.u))].sort();
    const h=["Timestamp",COL_UNIT];
    us.forEach(u=>{h.push(COL_LIST+u);h.push(COL_NOTE+u)});
    h.push(COL_BY,"เบอร์ติดต่อกลับ");
    const mk=(unit,names,note,mm)=>{
      const r=new Array(h.length).fill("");
      r[0]="28/8/2569 13:"+String(mm).padStart(2,"0");r[1]=unit;
      r[h.indexOf(COL_LIST+unit)]=names.join(", ");
      if(note)r[h.indexOf(COL_NOTE+unit)]=note;
      r[h.indexOf(COL_BY)]="(ทดสอบ)";return r;
    };
    const rows=[h];let mm=31;
    us.forEach((u,i)=>{
      if(i%7===3) return;
      const ppl=IIT.filter(d=>d.u===u).map(d=>d.n);
      const take=Math.max(1,Math.ceil(ppl.length*(i%3===0?0.5:0.85)));
      rows.push(mk(u,ppl.slice(0,take),i%5===0?"ลาป่วย 1 ราย":"",mm++));
      if(ppl.length>6) rows.push(mk(u,ppl.slice(take,take+2),"",mm++));
    });
    rows.push(mk(us[6],["สมชาย ทดสอบระบบ"],"ชื่อนี้ไม่มีในระบบ",58));
    setRaw(rows);setDemo(true);setErr("");setAt(new Date());
  };

  const agg=useMemo(()=>aggregate(raw),[raw]);
  const stOf=useCallback((id)=>{
    if(ov[id]==="in")return true;
    if(ov[id]==="out")return false;
    return agg.present.has(id);
  },[ov,agg]);

  const units=useMemo(()=>[...new Set(IIT.map(d=>d.u))].sort(),[]);
  const done=IIT.filter(d=>stOf(d.id)).length;
  const pct=Math.round(done/IIT.length*100);

  const rows=useMemo(()=>units.map(u=>{
    const ppl=IIT.filter(d=>d.u===u);
    const dn=ppl.filter(d=>stOf(d.id)).length;
    return{u,short:su(u),total:ppl.length,done:dn,ppl,co:CO.find(c=>c.u===u),miss:ppl.filter(d=>!stOf(d.id))};
  }),[units,stOf]);

  const sorted=useMemo(()=>[...rows].sort((a,b)=>(a.done/a.total)-(b.done/b.total)||b.total-a.total),[rows]);
  const shown=useMemo(()=>{
    let r=sorted;
    if(onlyMissing) r=r.filter(x=>x.done<x.total);
    if(q.trim()){const t=q.trim().toLowerCase();r=r.filter(x=>x.u.toLowerCase().includes(t)||x.ppl.some(d=>d.n.toLowerCase().includes(t)))}
    return r;
  },[sorted,onlyMissing,q]);

  const totalMiss=useMemo(()=>rows.reduce((s,r)=>s+r.miss.length,0),[rows]);

  const toggle=(id,cur)=>setOv(p=>({...p,[id]:cur?"out":"in"}));
  const clearOv=async()=>{setOv({});try{await window.storage.delete(SKEY)}catch(e){}};
  const ovN=Object.keys(ov).length;
  const tfmt=(d)=>d?d.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}):"-";

  const copyUnit=async(r)=>{
    const now=new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"});
    const txt=`[${r.u}] ยังไม่เข้าร่วม ${r.miss.length}/${r.total} คน\n\n`
      + r.miss.map((d,i)=>`${i+1}. ${d.n}`).join("\n")
      + `\n\nรบกวนติดตามให้เข้า Zoom ด้วยครับ\nข้อมูล ณ ${now} น.`;
    try{ await navigator.clipboard.writeText(txt) }
    catch(e){ const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove() }
    setCopied(r.u);setTimeout(()=>setCopied(""),2000);
  };

  return <div style={{minHeight:"100vh",background:"#F8FAFC",fontFamily:"'Noto Sans Thai','Segoe UI',sans-serif"}}>

    <div style={{background:`linear-gradient(135deg,${P},${PL})`,padding:"18px 24px",color:"#fff"}}>
      <div style={{fontSize:13,opacity:.8,letterSpacing:1}}>ITA 2569 | มทร.พระนคร</div>
      <div style={{fontSize:22,fontWeight:700,marginTop:4}}>Live Monitor — ยอดผู้เข้าร่วม IIT <span style={{fontSize:13,fontWeight:400,opacity:.7}}>v1.1</span></div>
      <div style={{fontSize:13,opacity:.7,marginTop:2}}>28 สิงหาคม 2569 | ข้อมูลจาก Google Form</div>
    </div>

    <div style={{padding:"20px 16px",maxWidth:1000,margin:"0 auto",display:"flex",flexDirection:"column",gap:16}}>

      <div style={{background:`linear-gradient(135deg,${P}22,${PL}22)`,borderRadius:12,padding:20,border:`1px solid ${P}33`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8,marginBottom:12}}>
          <div style={{fontSize:17,fontWeight:700,color:P}}>ความคืบหน้ารวม</div>
          {demo&&<span style={{background:"#F59E0B",color:"#fff",padding:"4px 10px",borderRadius:6,fontSize:13,fontWeight:600}}>DEMO MODE</span>}
        </div>
        <div style={{background:"#E2E8F0",borderRadius:8,height:34,overflow:"hidden",marginBottom:10,position:"relative"}}>
          <div style={{height:"100%",width:pct+"%",background:`linear-gradient(90deg,${P},#10B981)`,transition:"width .5s"}}/>
          <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:16,color:pct>50?"#fff":"#334155"}}>{done}/{IIT.length} คน ({pct}%)</div>
        </div>
        <div style={{display:"flex",gap:16,flexWrap:"wrap",fontSize:14,color:"#475569"}}>
          <span>ยังขาด <b style={{color:"#EF4444"}}>{totalMiss}</b> คน</span>
          <span>หน่วยครบ <b style={{color:"#10B981"}}>{rows.filter(r=>r.done===r.total).length}</b>/{units.length}</span>
          <span>Submit <b>{agg.submits}</b> ครั้ง</span>
          {ovN>0&&<span>Override <b style={{color:"#F59E0B"}}>{ovN}</b></span>}
        </div>
      </div>

      <Card>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
          <Btn onClick={load} dis={busy}>{busy?"กำลังโหลด...":"รีเฟรชข้อมูล"}</Btn>
          <Btn onClick={loadDemo} bg="#fff" color="#F59E0B" bd="1px solid #F59E0B">โหมดทดสอบ</Btn>
          <Btn onClick={()=>window.open(FORM_URL,"_blank")} bg="#fff" color={P} bd={`1px solid ${P}`}>เปิดฟอร์ม</Btn>
          {ovN>0&&<Btn onClick={clearOv} bg="#fff" color="#EF4444" bd="1px solid #EF4444">ล้าง Override</Btn>}
          <div style={{fontSize:13,color:"#64748B",marginLeft:"auto"}}>
            ดึงเมื่อ {tfmt(at)}{agg.last?" | ล่าสุดใน Sheet: "+agg.last:""}
          </div>
        </div>
      </Card>

      {err&&<div style={{background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:12,padding:16,color:"#DC2626",fontSize:14}}>
        <b>ดึงข้อมูลไม่สำเร็จ:</b> {err}
        <div style={{color:"#991B1B",fontSize:13,marginTop:4}}>ตรวจว่า Sheet ถูก Publish to web แบบ CSV แล้ว หรือกด "โหมดทดสอบ" เพื่อดูหน้าตาระบบ</div>
      </div>}

      <Card>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center",marginBottom:12}}>
          <div style={{fontSize:17,fontWeight:600,color:P}}>รายหน่วยงาน</div>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="ค้นหาหน่วยงานหรือชื่อ..." style={{padding:"6px 12px",borderRadius:8,border:`2px solid ${q?P:"#E2E8F0"}`,fontSize:14,outline:"none",flex:1,minWidth:160}}/>
          <label style={{display:"flex",alignItems:"center",gap:6,fontSize:14,color:"#475569",cursor:"pointer"}}>
            <input type="checkbox" checked={onlyMissing} onChange={e=>setOnlyMissing(e.target.checked)}/>เฉพาะที่ยังไม่ครบ
          </label>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {!shown.length&&<div style={{color:"#94A3B8",fontSize:15,padding:8}}>ไม่พบหน่วยงานที่ตรงเงื่อนไข</div>}
          {shown.map(r=>{
            const ok=r.done===r.total,p=Math.round(r.done/r.total*100),op=openU[r.u];
            return <div key={r.u} style={{background:ok?"#F0FDF4":"#FAFAFE",borderRadius:8,padding:"8px 12px"}}>
              <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
                <div onClick={()=>setOpenU(o=>({...o,[r.u]:!o[r.u]}))} style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap",flex:1,minWidth:240,cursor:"pointer"}}>
                  <div style={{width:14,fontSize:13,color:"#94A3B8"}}>{op?"▾":"▸"}</div>
                  <div style={{minWidth:118,fontSize:14,fontWeight:600,color:ok?"#10B981":"#334155"}}>{r.short}</div>
                  <div style={{flex:1,minWidth:80,background:"#E2E8F0",borderRadius:4,height:16,overflow:"hidden"}}>
                    <div style={{height:"100%",width:p+"%",background:ok?"#10B981":p>0?"#F59E0B":"#E2E8F0",transition:"width .3s"}}/>
                  </div>
                  <div style={{minWidth:50,fontSize:14,fontWeight:600,textAlign:"right",color:ok?"#10B981":"#334155"}}>{r.done}/{r.total}</div>
                  {!ok&&r.co&&<div style={{fontSize:12,color:"#64748B",minWidth:165}}>{r.co.n} {r.co.m!=="-"?r.co.m:r.co.pi}</div>}
                </div>
                {!ok&&<button onClick={()=>copyUnit(r)} title={"คัดลอกรายชื่อที่ขาด "+r.miss.length+" คน"} style={{padding:"5px 12px",borderRadius:6,border:`1px solid ${copied===r.u?"#10B981":P}`,background:copied===r.u?"#10B981":"#fff",color:copied===r.u?"#fff":P,fontSize:13,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>
                  {copied===r.u?"คัดลอกแล้ว":"คัดลอกรายชื่อที่ขาด ("+r.miss.length+")"}
                </button>}
              </div>
              {op&&<div style={{marginTop:8,paddingLeft:24,display:"flex",flexDirection:"column",gap:4}}>
                {r.ppl.map(d=>{const s=stOf(d.id);return <div key={d.id} style={{display:"flex",gap:8,alignItems:"center",fontSize:14}}>
                  <span style={{width:18}}>{s?"✅":"⬜"}</span>
                  <span style={{flex:1,color:s?"#10B981":"#334155"}}>{d.n}</span>
                  {ov[d.id]&&<span style={{fontSize:11,background:"#FEF3C7",color:"#92400E",padding:"1px 6px",borderRadius:4}}>manual</span>}
                  <button onClick={()=>toggle(d.id,s)} style={{padding:"3px 10px",borderRadius:6,border:`1px solid ${s?"#EF4444":"#10B981"}`,background:"#fff",color:s?"#EF4444":"#10B981",fontSize:12,cursor:"pointer"}}>{s?"ยกเลิก":"ทำเครื่องหมาย"}</button>
                </div>})}
              </div>}
            </div>;
          })}
        </div>
      </Card>

      {agg.unmatched.length>0&&<Card accent="#F59E0B">
        <div style={{fontSize:17,fontWeight:600,color:"#B45309",marginBottom:6}}>ชื่อที่จับคู่ไม่ได้ ({agg.unmatched.length})</div>
        <div style={{fontSize:13,color:"#92400E",marginBottom:10}}>ชื่อเหล่านี้มีใน Form แต่ไม่ตรงกับรายชื่อในระบบ — อาจเป็นการเปลี่ยนตัวผู้ตอบ หรือพิมพ์ผิด</div>
        <div style={{display:"flex",flexDirection:"column",gap:4}}>
          {agg.unmatched.map((x,i)=><div key={i} style={{display:"flex",gap:10,padding:"6px 10px",background:"#FFFBEB",borderRadius:6,fontSize:14,flexWrap:"wrap"}}>
            <span style={{fontWeight:500,minWidth:150}}>{x.name}</span>
            <span style={{color:"#64748B",fontSize:13}}>{su(x.unit)}</span>
            <span style={{color:"#94A3B8",fontSize:12,marginLeft:"auto"}}>{x.ts}</span>
          </div>)}
        </div>
      </Card>}

      {agg.notes.length>0&&<Card>
        <div style={{fontSize:17,fontWeight:600,color:P,marginBottom:12}}>หมายเหตุจากผู้ประสาน ({agg.notes.length})</div>
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {agg.notes.map((n,i)=><div key={i} style={{background:"#F8FAFC",borderRadius:6,padding:"8px 12px",fontSize:14}}>
            <div style={{fontWeight:600,color:P,fontSize:13}}>{su(n.unit)} <span style={{color:"#94A3B8",fontWeight:400}}>{n.by} | {n.ts}</span></div>
            <div style={{color:"#334155",marginTop:2}}>{n.text}</div>
          </div>)}
        </div>
      </Card>}

      <div style={{textAlign:"center",padding:"8px 0 24px",color:"#94A3B8",fontSize:13}}>
        จัดทำโดย สวท. | ผู้ตอบ {IIT.length} คน จาก {units.length} หน่วยงาน
      </div>
    </div>
  </div>;
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
